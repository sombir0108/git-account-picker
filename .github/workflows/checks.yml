# Runs on every pull request (and on main after a merge) so changes that
# would break a shell or PowerShell script are caught before they ship.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    name: Shell scripts (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shell scripts use LF line endings
        run: |
          bad=$(git ls-files '*.sh' | xargs grep -l $'\r' || true)
          if [ -n "$bad" ]; then
            echo "These shell scripts have Windows (CRLF) line endings:"
            echo "$bad"
            exit 1
          fi

      - name: Scripts people run directly are executable
        run: |
          for f in install.sh uninstall.sh bin/*.sh release/*.sh tests/run-tests.sh; do
            mode=$(git ls-files -s "$f" | cut -c1-6)
            [ "$mode" = 100755 ] || { echo "$f is not executable (git update-index --chmod=+x $f)"; exit 1; }
          done

      - name: Syntax check (bash -n)
        run: |
          for f in $(git ls-files '*.sh'); do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck
        run: shellcheck --severity=warning $(git ls-files '*.sh')

      - name: Tests
        run: bash tests/run-tests.sh

  macos:
    name: Shell scripts (macOS built-in bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # macOS ships bash 3.2 at /bin/bash, and that is the `bash` git runs
      # the credential helper with unless the user installed a newer one.
      - name: Syntax check (bash -n)
        run: |
          /bin/bash --version | head -n 1
          for f in $(git ls-files '*.sh'); do
            echo "bash -n $f"
            /bin/bash -n "$f"
          done

      - name: Tests
        run: /bin/bash tests/run-tests.sh

      - name: Build the native picker window
        run: |
          swiftc --version
          swiftc -O -parse-as-library gui/mac/AccountPicker.swift -o AccountPicker

      - name: Render the picker window (screenshots)
        run: |
          mkdir -p screenshots
          export GIT_ACCOUNT_PICKER_CONFIG_DIR="$RUNNER_TEMP/picker-config"
          for theme in light dark; do
            ./AccountPicker --render "screenshots/manage-$theme.png" --theme "$theme" --icon gui/icon.png \
              --accounts personal-account,work-account,client-account --active work-account
            ./AccountPicker --mode choose --render "screenshots/choose-$theme.png" --theme "$theme" --icon gui/icon.png \
              --accounts personal-account,work-account --active personal-account
            ./AccountPicker --mode login --render "screenshots/login-$theme.png" --theme "$theme" --icon gui/icon.png
          done
          ls -la screenshots
          for f in screenshots/*.png; do test -s "$f" || { echo "empty $f"; exit 1; }; done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mac-picker-screenshots
          path: screenshots/

  powershell:
    name: PowerShell scripts (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse every .ps1
        shell: powershell
        run: |
          $failed = $false
          foreach ($f in (git ls-files '*.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors) {
              $failed = $true
              Write-Host "::error file=$f::$($errors[0].Message)"
              $errors | ForEach-Object { Write-Host "  $f line $($_.Extent.StartLineNumber): $($_.Message)" }
            }
            else { Write-Host "OK  $f" }
          }
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
          if ($failed) { exit 1 }

      - name: Popup smoke test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\picker-ui-smoke.ps1
